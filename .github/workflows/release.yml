name: publish to nuget

# Publishing is driven by a tag and authenticated with NuGet Trusted Publishing, so there is
# no API key anywhere: not in a secret, not in a terminal, not in this file. NuGet trusts a
# short-lived OIDC token that GitHub mints for this repository and this workflow file only,
# and its own guidance is that API keys are discouraged for automated publishing.
#
# The trust is registered at nuget.org/account/trustedpublishing and is pinned to
# HorizunGroup/horizun-msproject-mcp and to this file. Renaming this file breaks publishing
# until the policy is updated, which is the point.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0'
        required: true

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      # id-token is what lets GitHub mint the OIDC token NuGet trusts; contents is for
      # attaching the package to the release.
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache NuGet and the IKVM translation
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            src/HorizunMsProjectMcp/obj
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build src/HorizunMsProjectMcp -c Debug --nologo

      # A version on NuGet cannot be deleted, only hidden. Nothing ships that has not passed
      # everything first.
      - name: Prove it works before publishing anything
        run: |
          python tools/smoke-test.py
          python tools/acceptance-test.py
          python tools/scheduler-test.py
          python tools/planning-test.py
          python tools/robustness-test.py

      - name: Pack
        run: dotnet pack src/HorizunMsProjectMcp -c Release --nologo

      - name: Check the version matches the tag
        shell: bash
        run: |
          expected="${{ github.event.inputs.version }}"
          if [ -z "$expected" ]; then expected="${GITHUB_REF_NAME#v}"; fi
          if [ ! -f "nupkg/HorizunMsProjectMcp.$expected.nupkg" ]; then
            echo "The tag asks for $expected but the package built is:"
            ls nupkg/
            echo "Update <Version> in the csproj to match the tag before releasing."
            exit 1
          fi
          echo "publishing HorizunMsProjectMcp.$expected.nupkg"

      # Exchanges the OIDC token for a key that lives for a few minutes inside this runner.
      # Nothing to store, nothing to rotate, nothing to leak.
      - name: Authenticate with NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: pablo-horizun

      - name: Push to NuGet
        shell: bash
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Attach the package to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
