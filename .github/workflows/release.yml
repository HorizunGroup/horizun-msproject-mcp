name: publish to nuget

# Publishing is driven by a tag and authenticated with NuGet Trusted Publishing, so there is
# no API key anywhere: not in a secret, not in a terminal, not in this file. NuGet trusts a
# short-lived OIDC token that GitHub mints for this repository and this workflow file only,
# and its own guidance is that API keys are discouraged for automated publishing.
#
# The trust is registered at nuget.org/account/trustedpublishing and is pinned to
# HorizunGroup/horizun-msproject-mcp and to this file. Renaming this file breaks publishing
# until the policy is updated, which is the point.
#
# Two jobs. `publish` builds, tests and packs, and leaves the GitHub release as a DRAFT with the
# unsigned package and extension attached. `firmar-y-publicar` runs on the self-hosted signing
# runner after Pablo approves the `firma-certum` environment: it signs the project's own DLL with
# the Certum certificate (inside the .nupkg), verifies it, pushes the SIGNED package to NuGet and
# only then publishes the release. Nothing unsigned ever reaches NuGet. See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.0'
        required: true

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      # contents is for attaching the package to the draft release. Nothing is pushed to
      # NuGet from this job: that happens after signing, in firmar-y-publicar.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache NuGet and the IKVM translation
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            src/HorizunMsProjectMcp/obj
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build src/HorizunMsProjectMcp -c Debug --nologo

      # A version on NuGet cannot be deleted, only hidden. Nothing ships that has not passed
      # everything first.
      - name: Prove it works before publishing anything
        run: |
          python tools/smoke-test.py
          python tools/acceptance-test.py
          python tools/scheduler-test.py
          python tools/planning-test.py
          python tools/robustness-test.py
          python tools/packaging-test.py
          python tools/export-fidelity-test.py
          python tools/pmo-test.py
          python tools/imported-file-test.py
          python tools/planner-features-test.py
          python tools/field-report-test.py
          python tools/comite-obra-test.py
          python tools/project-engine-test.py

      - name: Pack
        run: dotnet pack src/HorizunMsProjectMcp -c Release --nologo

      # Built from the same commit as the package it installs, and the build
      # refuses to run when the two versions disagree.
      - name: Build the Claude Desktop extension
        run: python scripts/build_mcpb.py

      - name: Check the version matches the tag
        shell: bash
        run: |
          expected="${{ github.event.inputs.version }}"
          if [ -z "$expected" ]; then expected="${GITHUB_REF_NAME#v}"; fi
          if [ ! -f "nupkg/HorizunMsProjectMcp.$expected.nupkg" ]; then
            echo "The tag asks for $expected but the package built is:"
            ls nupkg/
            echo "Update <Version> in the csproj to match the tag before releasing."
            exit 1
          fi
          echo "publishing HorizunMsProjectMcp.$expected.nupkg"

      # The .mcpb is how Claude Desktop installs this, so it has to be on the
      # release itself: there is nowhere else for someone to get it. It is created as a
      # draft; firmar-y-publicar signs the assets and publishes it.
      - name: Attach the package and the extension to the draft release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            nupkg/*.nupkg
            dist/*.mcpb
          generate_release_notes: true

      # A dispatch-triggered publish has no tag and therefore no release to
      # attach to, so the extension is kept as a build artifact instead of being
      # silently dropped.
      - name: Keep the extension when there is no release to attach it to
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: claude-desktop-extension
          path: dist/*.mcpb
          if-no-files-found: error

  firmar-y-publicar:
    # Waits for Pablo's approval of the environment (required reviewer), with SimplySign Desktop
    # connected on the runner's machine.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, windows, horizun-sign]
    environment: firma-certum

    permissions:
      # contents: edit the draft release; id-token: the OIDC token NuGet Trusted Publishing trusts.
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Signs the project's own DLL inside the .nupkg, regenerates the hashes, verifies every
      # signature, uploads the signed assets to the draft (--clobber) and re-reads them. It does
      # not publish the release (-SinPublicar): NuGet goes first, then the release.
      - name: Sign the release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $salida = Join-Path $env:RUNNER_TEMP 'firmado'
          if (Test-Path $salida) { Remove-Item $salida -Recurse -Force }
          ./scripts/firmar-release.ps1 -Repo '${{ github.repository }}' -Tag '${{ github.ref_name }}' -SinPublicar -Salida $salida

      - name: Authenticate with NuGet
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: pablo-horizun

      # The signed package from the output folder, not a rebuilt one.
      - name: Push the signed package to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          $salida = Join-Path $env:RUNNER_TEMP 'firmado'
          $expected = "HorizunMsProjectMcp.$($env:GITHUB_REF_NAME.TrimStart('v')).nupkg"
          $pkg = Join-Path $salida $expected
          if (-not (Test-Path $pkg)) { throw "Signed package not found: $pkg" }
          dotnet nuget push $pkg --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed ($LASTEXITCODE)" }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit '${{ github.ref_name }}' -R '${{ github.repository }}' --draft=false
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed ($LASTEXITCODE)" }
