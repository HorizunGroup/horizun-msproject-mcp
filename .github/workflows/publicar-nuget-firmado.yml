name: Publicar NuGet firmado
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Borrador firmado, por ejemplo v1.6.1'
        required: true
        type: string
permissions: {}
jobs:
  publicar:
    runs-on: [self-hosted, windows, horizun-sign]
    environment: firma-certum
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Descargar y verificar el paquete firmado
        id: paquete
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Tag inválido' }
          $release = gh release view $env:TAG -R '${{ github.repository }}' --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Se requiere un borrador.' }
          $version = $env:TAG.Substring(1)
          $name = "HorizunMsProjectMcp.$version.nupkg"
          $dir = Join-Path $env:RUNNER_TEMP 'paquete-firmado'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download $env:TAG -R '${{ github.repository }}' -D $dir -p $name --clobber
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar el paquete.' }
          $package = Join-Path $dir $name
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($package)
          try {
            $entry = @($zip.Entries | Where-Object { $_.FullName -match '/horizun-msproject-mcp\.dll$' })
            if ($entry.Count -ne 1) { throw 'DLL propia ausente o ambigua.' }
            $dll = Join-Path $dir 'horizun-msproject-mcp.dll'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry[0], $dll, $true)
          } finally { $zip.Dispose() }
          $sig = Get-AuthenticodeSignature -LiteralPath $dll
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Thumbprint -ne 'D19F95C700EFEB78F03B6A2F9F6FBF87BF9BF8FA' -or $sig.TimeStamperCertificate.Subject -notlike '*Certum*') { throw 'Firma Certum inválida.' }
          "package=$package" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: pablo-horizun
      - name: Publicar paquete verificado
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push '${{ steps.paquete.outputs.package }}' --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'NuGet rechazó el paquete.' }
      - name: Publicar el borrador
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit '${{ inputs.tag }}' -R '${{ github.repository }}' --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'No se publicó la release.' }
